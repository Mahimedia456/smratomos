name: Atomos Vercel Manual Publication
# Research, source collection, media and PDF commits must not deploy Vercel.
# This workflow runs only when an operator explicitly chooses Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Atomos website through configured Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not configured. Add it to repository Actions secrets before manual website publication."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --request POST "$VERCEL_DEPLOY_HOOK"
